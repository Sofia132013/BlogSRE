<header class="navbar site-nav">
    <div class="container site-nav__inner">
        <div class="site-nav__start">
            <a class="navbar-brand brand" href="{% url "index" %}">Blog<span class="brand__dot">.</span></a>
            {% if user.is_authenticated %}
                <a class="button button--small site-nav__write" href="{% url "new_post" %}"><span aria-hidden="true">＋</span> Написать пост</a>
            {% endif %}
        </div>
        <nav class="site-nav__links" aria-label="Основная навигация">
        {% if user.is_authenticated %}
            <a href="{% url "profile" user.username %}" class="site-nav__user">@{{ user.username }}</a>
            <a class="site-nav__link" href="{% url "categories" %}">Категории</a>
            <a class="site-nav__link site-nav__optional" href="{% url "follow_index" %}">Подписки</a>
            <a class="site-nav__link" href="{% url "logout" %}">Выйти</a>
        {% else %}
            <a class="site-nav__link" href="{% url "login" %}">Войти</a>
            <a class="button button--small" href="{% url "signup" %}">Создать аккаунт</a>
        {% endif %}
        </nav>
    </div>
</header>
