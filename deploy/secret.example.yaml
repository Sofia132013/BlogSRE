# Copy to deploy/secret.yaml and replace the placeholders before applying.
# Use the same database password in both Secrets; URL-encode it in DATABASE_URL.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: blog-sre
type: Opaque
stringData:
  POSTGRES_PASSWORD: replace-with-db-password
---
apiVersion: v1
kind: Secret
metadata:
  name: django-secrets
  namespace: blog-sre
type: Opaque
stringData:
  DATABASE_URL: postgresql://blog:replace-with-db-password@postgres:5432/blog
  DJANGO_SECRET_KEY: replace-with-a-long-random-value
