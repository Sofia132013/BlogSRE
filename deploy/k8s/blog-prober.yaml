apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-prober
  namespace: blog-sre
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: blog-prober
  template:
    metadata:
      labels:
        app: blog-prober
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9099"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      containers:
        - name: prober
          image: blog:local
          imagePullPolicy: Never
          command: [python, -m, monitoring.prober]
          ports:
            - name: metrics
              containerPort: 9099
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 96Mi
